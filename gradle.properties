android.useAndroidX=true
android.enableJetifier=true

# Fix for Java 25 compatibility with Kotlin
kotlin.jvm.target.validation.mode = IGNORE

# Force Kotlin incremental compilation to work around JavaVersion parsing issue
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable Kotlin daemon for Java 25 compatibility
kotlin.incremental.useClasspathSnapshot=false
kotlin.incremental.usePreciseJavaTracking=false

# Completely disable Kotlin daemon for Java 25
kotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.incremental=false